<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Diabetes Prediction</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f3f9fb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      width: 450px;
      overflow-y: auto;
      max-height: 95vh;
    }
    h2 {
      text-align: center;
      color: #0077b6;
      margin-bottom: 25px;
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 6px;
      margin-top: 5px;
    }
    button {
      margin-top: 20px;
      width: 100%;
      background-color: #0077b6;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #005f87;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🩺 Diabetes Prediction Form</h2>
    <form action="/predict" method="POST">

      <!-- Age -->
      <label>Age</label>
      <input type="number" name="age" min="0" placeholder="Enter your age" required>

      <!-- Gender -->
      <label>Gender</label>
      <select name="gender" required>
        <option value="">Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>

      <!-- Symptoms -->
      <label>1. Polyuria</label>
      <select name="Polyuria" required>
        <option value="1">Yes</option>
        <option value="0">No</option>
      </select>

      <label>2. Polydipsia</label>
      <select name="Polydipsia" required>
        <option value="1">Yes</option>
        <option value="0">No</option>
      </select>

      <label>3. Sudden Weight Loss</label>
      <select name="sudden_weight_loss" required>
        <option value="1">Yes</option>
        <option value="0">No</option>
      </select>

      <label>4. Weakness</label>
      <select name="weakness" required>
        <option value="1">Yes</option>
        <option value="0">No</option>
      </select>

      <label>5. Polyphagia</label>
      <select name="Polyphagia" required>
        <option value="1">Yes</option>
        <option value="0">No</option>
      </select>

      <label>6. Genital Thrush</label>
      <select name="Genital_thrush" required>
        <option value="1">Yes</option>
        <option value="0">No</option>
      </select>

      <label>7. Visual Blurring</label>
      <select name="visual_blurring" required>
        <option value="1">Yes</option>
        <option value="0">No</option>
      </select>

      <label>8. Itching</label>
      <select name="Itching" required>
        <option value="1">Yes</option>
        <option value="0">No</option>
      </select>

      <label>9. Irritability</label>
      <select name="Irritability" required>
        <option value="1">Yes</option>
        <option value="0">No</option>
      </select>

      <label>10. Delayed Healing</label>
      <select name="delayed_healing" required>
        <option value="1">Yes</option>
        <option value="0">No</option>
      </select>

      <label>11. Partial Paresis</label>
      <select name="partial_paresis" required>
        <option value="1">Yes</option>
        <option value="0">No</option>
      </select>

      <label>12. Muscle Stiffness</label>
      <select name="muscle_stiffness" required>
        <option value="1">Yes</option>
        <option value="0">No</option>
      </select>

      <label>13. Alopecia</label>
      <select name="Alopecia" required>
        <option value="1">Yes</option>
        <option value="0">No</option>
      </select>

      <label>14. Obesity</label>
      <select name="Obesity" required>
        <option value="1">Yes</option>
        <option value="0">No</option>
      </select>

      <button type="submit">Predict</button>
    </form>
  </div>
</body>
</html>
